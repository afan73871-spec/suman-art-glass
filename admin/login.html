<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login - Suman Art Glass</title>
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="12" width="15" height="32" stroke="#c8963e" stroke-width="2"/>
                    <rect x="24" y="6" width="18" height="38" stroke="#c8963e" stroke-width="2"/>
                    <rect x="10" y="18" width="5" height="5" fill="#c8963e"/>
                    <rect x="30" y="12" width="5" height="5" fill="#c8963e"/>
                </svg>
                <h1>SUMAN ART GLASS</h1>
                <span>Super Admin Panel</span>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to manage your website content</p>
            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="admin@sumanartglass.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="remember-row">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="login-btn">Sign In to Dashboard →</button>
            </form>
            <div class="login-back">
                <a href="../index.html">← Back to Website</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email === 'admin@sumanartglass.com' && password === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminEmail', email);
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid credentials!\n\nDemo: admin@sumanartglass.com / admin123');
            }
        }

        if (localStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
