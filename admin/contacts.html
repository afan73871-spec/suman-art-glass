<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 50 50" fill="none"><rect x="5" y="12" width="15" height="32" stroke="#c8963e" stroke-width="2"/><rect x="24" y="6" width="18" height="38" stroke="#c8963e" stroke-width="2"/><rect x="10" y="18" width="5" height="5" fill="#c8963e"/><rect x="30" y="12" width="5" height="5" fill="#c8963e"/></svg>
                <div><h1>SUMAN</h1><span>ART GLASS</span></div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">MAIN MENU</div>
                <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
                <div class="sidebar-section">CONTENT</div>
                <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Projects</a>
                <a href="services.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15 1.65 1.65 0 0 0 3 14V12a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 8 13.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 14.6 15H15a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 20 16.4z"/></svg>Services</a>
                <a href="gallery.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Gallery</a>
                <a href="clients.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Clients</a>
                <a href="testimonials.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Testimonials</a>
                <div class="sidebar-section">INQUIRIES</div>
                <a href="contacts.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Contact Inquiries</a>
                <div class="sidebar-section">OTHER</div>
                <a href="billing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Billing</a>
                <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15 1.65 1.65 0 0 0 3 14V12a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 8 13.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 14.6 15H15a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 20 16.4z"/></svg>Settings</a>
                <a href="#" onclick="handleLogout()" style="color: #ef4444;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>Contact Inquiries</h2>
                <div class="top-header-right">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" placeholder="Search inquiries..." oninput="searchTable(this, 'contactsTable')">
                    </div>
                    <div class="user-profile"><img src="../images/team.jpg" alt="Admin"><span>Super Admin</span></div>
                </div>
            </header>

            <div class="content-area">
                <div class="tabs">
                    <button class="tab-btn active">All</button>
                    <button class="tab-btn">New</button>
                    <button class="tab-btn">Read</button>
                    <button class="tab-btn">Replied</button>
                </div>

                <div class="data-card">
                    <div class="data-card-header">
                        <h3>All Inquiries (<span id="contactCount">0</span>)</h3>
                    </div>
                    <table class="data-table" id="contactsTable">
                        <thead>
                            <tr>
                                <th><input type="checkbox" onclick="toggleAllContacts(this)"></th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="contactsBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="viewModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Inquiry Details</h3>
                <button class="modal-close" onclick="closeModal('viewModal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div class="modal-body">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
                    <div><label style="font-size:0.75rem;color:var(--gray);font-weight:600;">Name</label><p id="viewName" style="margin-top:0.25rem;font-weight:600;"></p></div>
                    <div><label style="font-size:0.75rem;color:var(--gray);font-weight:600;">Email</label><p id="viewEmail" style="margin-top:0.25rem;"></p></div>
                    <div><label style="font-size:0.75rem;color:var(--gray);font-weight:600;">Phone</label><p id="viewPhone" style="margin-top:0.25rem;"></p></div>
                    <div><label style="font-size:0.75rem;color:var(--gray);font-weight:600;">Service</label><p id="viewService" style="margin-top:0.25rem;"></p></div>
                </div>
                <div><label style="font-size:0.75rem;color:var(--gray);font-weight:600;">Message</label><p id="viewMessage" style="margin-top:0.5rem;padding:1rem;background:var(--light-gray);border-radius:8px;line-height:1.6;"></p></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('viewModal')">Close</button>
                <button class="btn btn-primary">Reply via Email</button>
            </div>
        </div>
    </div>

    <script src="../js/dataManager.js"></script>
    <script src="js/admin.js"></script>
    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true') window.location.href = 'login.html';
        
        function loadContacts() {
            const contacts = DataManager.getAll('contacts');
            document.getElementById('contactCount').textContent = contacts.length;
            document.getElementById('contactsBody').innerHTML = contacts.map(c => `
                <tr data-id="${c.id}">
                    <td><input type="checkbox"></td>
                    <td><strong>${c.name}</strong></td>
                    <td>${c.email}</td>
                    <td>${c.phone}</td>
                    <td>${c.service}</td>
                    <td><span class="badge ${c.status === 'new' ? 'badge-danger' : c.status === 'read' ? 'badge-warning' : 'badge-success'}">${c.status}</span></td>
                    <td>${c.date}</td>
                    <td>
                        <button class="btn-icon" title="View" onclick="viewContact(${c.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                        <button class="btn-icon" title="Delete" onclick="deleteContact(${c.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                    </td>
                </tr>
            `).join('');
        }

        function viewContact(id) {
            const c = DataManager.getById('contacts', id);
            if (c) {
                document.getElementById('viewName').textContent = c.name;
                document.getElementById('viewEmail').textContent = c.email;
                document.getElementById('viewPhone').textContent = c.phone;
                document.getElementById('viewService').textContent = c.service;
                document.getElementById('viewMessage').textContent = c.message;
                document.getElementById('viewModal').classList.add('active');
            }
        }

        function toggleAllContacts(master) {
            document.querySelectorAll('#contactsBody input[type="checkbox"]').forEach(cb => cb.checked = master.checked);
        }

        loadContacts();
    </script>
</body>
</html>
