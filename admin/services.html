<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Suman Art Glass Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 50 50" fill="none"><rect x="5" y="12" width="15" height="32" stroke="#c8963e" stroke-width="2"/><rect x="24" y="6" width="18" height="38" stroke="#c8963e" stroke-width="2"/><rect x="10" y="18" width="5" height="5" fill="#c8963e"/><rect x="30" y="12" width="5" height="5" fill="#c8963e"/></svg>
                <div><h1>SUMAN</h1><span>ART GLASS</span></div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">MAIN MENU</div>
                <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
                <div class="sidebar-section">CONTENT</div>
                <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Projects</a>
                <a href="services.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15 1.65 1.65 0 0 0 3 14V12a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 8 13.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 14.6 15H15a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 20 16.4z"/></svg>Services</a>
                <a href="gallery.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Gallery</a>
                <a href="clients.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Clients</a>
                <a href="testimonials.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Testimonials</a>
                <div class="sidebar-section">INQUIRIES</div>
                <a href="contacts.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Contact Inquiries</a>
                <div class="sidebar-section">OTHER</div>
                <a href="billing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Billing</a>
                <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15 1.65 1.65 0 0 0 3 14V12a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 8 13.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 14.6 15H15a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 20 16.4z"/></svg>Settings</a>
                <a href="#" onclick="handleLogout()" style="color: #ef4444;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>Services</h2>
                <div class="top-header-right">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" placeholder="Search services..." oninput="searchTable(this, 'servicesTable')">
                    </div>
                    <button class="btn btn-primary" onclick="openModal('add', 'service')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Add Service
                    </button>
                    <div class="user-profile"><img src="../images/team.jpg" alt="Admin"><span>Super Admin</span></div>
                </div>
            </header>

            <div class="content-area">
                <div class="data-card">
                    <div class="data-card-header">
                        <h3>All Services (<span id="serviceCount">0</span>)</h3>
                    </div>
                    <table class="data-table" id="servicesTable">
                        <thead>
                            <tr>
                                <th>Icon</th>
                                <th>Service Name</th>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="servicesBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Service Modal -->
    <div class="modal-overlay" id="serviceModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Service</h3>
                <button class="modal-close" onclick="closeModal('serviceModal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Service Name *</label>
                    <input type="text" id="serviceName" name="name" placeholder="Enter service name">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="serviceCategory" name="category">
                            <option value="glass">Glass</option>
                            <option value="aluminium">Aluminium</option>
                            <option value="upvc">UPVC</option>
                            <option value="facade">Facade</option>
                            <option value="specialty">Specialty</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="serviceDescription" name="description" rows="3" placeholder="Service description"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('serviceModal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveService()">Save Service</button>
            </div>
        </div>
    </div>

    <script src="../js/dataManager.js"></script>
    <script src="js/admin.js"></script>
    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true') window.location.href = 'login.html';

        function loadServices() {
            const services = DataManager.getAll('services');
            document.getElementById('serviceCount').textContent = services.length;
            const tbody = document.getElementById('servicesBody');
            tbody.innerHTML = services.map(s => `
                <tr data-id="${escapeHTML(s.id)}">
                    <td style="font-size:1.5rem;">⚙️</td>
                    <td><strong>${escapeHTML(s.name)}</strong></td>
                    <td><span class="badge badge-success">${escapeHTML(capitalize(s.category))}</span></td>
                    <td>${escapeHTML(s.description) || '-'}</td>
                    <td>
                        <button class="btn-icon" title="Edit" onclick="openModal('edit', 'service', ${parseInt(s.id) || 0})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                        <button class="btn-icon" title="Delete" onclick="deleteService(${parseInt(s.id) || 0})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                    </td>
                </tr>
            `).join('');
        }

        loadServices();
    </script>
</body>
</html>
