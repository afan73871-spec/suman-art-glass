<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 50 50" fill="none"><rect x="5" y="12" width="15" height="32" stroke="#c8963e" stroke-width="2"/><rect x="24" y="6" width="18" height="38" stroke="#c8963e" stroke-width="2"/><rect x="10" y="18" width="5" height="5" fill="#c8963e"/><rect x="30" y="12" width="5" height="5" fill="#c8963e"/></svg>
                <div><h1>SUMAN</h1><span>ART GLASS</span></div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">MAIN MENU</div>
                <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
                <div class="sidebar-section">CONTENT</div>
                <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Projects</a>
                <a href="services.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15 1.65 1.65 0 0 0 3 14V12a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 8 13.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 14.6 15H15a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 20 16.4z"/></svg>Services</a>
                <a href="gallery.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Gallery</a>
                <a href="clients.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Clients</a>
                <a href="testimonials.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Testimonials</a>
                <div class="sidebar-section">INQUIRIES</div>
                <a href="contacts.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Contact Inquiries<span class="badge">3</span></a>
                <div class="sidebar-section">OTHER</div>
                <a href="settings.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15 1.65 1.65 0 0 0 3 14V12a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 8 13.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 14.6 15H15a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 20 16.4z"/></svg>Settings</a>
                <a href="#" onclick="handleLogout()" style="color: #ef4444;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>Settings</h2>
                <div class="top-header-right">
                    <div class="user-profile">
                        <img src="../images/team.jpg" alt="Admin">
                        <span>Super Admin</span>
                    </div>
                </div>
            </header>

            <div class="content-area">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('company')">Company Info</button>
                    <button class="tab-btn" onclick="switchTab('account')">Account</button>
                    <button class="tab-btn" onclick="switchTab('social')">Social Media</button>
                    <button class="tab-btn" onclick="switchTab('seo')">SEO</button>
                </div>

                <!-- Company Info Tab -->
                <div class="tab-content" id="tab-company">
                    <div class="data-card">
                        <div class="data-card-header">
                            <h3>Company Information</h3>
                        </div>
                        <div class="modal-body">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Company Name</label>
                                    <input type="text" value="Suman Art Glass">
                                </div>
                                <div class="form-group">
                                    <label>Tagline</label>
                                    <input type="text" value="Transforming Spaces with Premium Glass Solutions">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <textarea rows="3">Leading provider of premium glass and aluminium solutions with 15+ years of expertise. We specialize in curtain wall glazing, spider glazing, structural glazing, UPVC windows, and aluminium partition work across residential, commercial, and institutional projects.</textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Phone</label>
                                    <input type="text" value="+91 98765 43210">
                                </div>
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" value="info@sumanartglass.com">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <textarea rows="2">123 Glass Avenue, Industrial Area, Lucknow, UP 226001, India</textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Working Hours</label>
                                    <input type="text" value="Mon - Sat: 9:00 AM - 6:00 PM">
                                </div>
                                <div class="form-group">
                                    <label>Year Established</label>
                                    <input type="text" value="2010">
                                </div>
                            </div>
                            <div style="margin-top:1.5rem;">
                                <button class="btn btn-primary" onclick="showNotification('Company info updated successfully!')">Save Changes</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Account Tab -->
                <div class="tab-content" id="tab-account" style="display:none;">
                    <div class="data-card">
                        <div class="data-card-header">
                            <h3>Account Settings</h3>
                        </div>
                        <div class="modal-body">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Admin Name</label>
                                    <input type="text" value="Super Admin">
                                </div>
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" value="admin@sumanartglass.com">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Current Password</label>
                                <input type="password" placeholder="Enter current password">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>New Password</label>
                                    <input type="password" placeholder="Enter new password">
                                </div>
                                <div class="form-group">
                                    <label>Confirm Password</label>
                                    <input type="password" placeholder="Confirm new password">
                                </div>
                            </div>
                            <div style="margin-top:1.5rem;">
                                <button class="btn btn-primary" onclick="showNotification('Account updated successfully!')">Update Account</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Social Media Tab -->
                <div class="tab-content" id="tab-social" style="display:none;">
                    <div class="data-card">
                        <div class="data-card-header">
                            <h3>Social Media Links</h3>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label>Facebook</label>
                                <input type="url" value="https://facebook.com/sumanartglass" placeholder="https://facebook.com/...">
                            </div>
                            <div class="form-group">
                                <label>Instagram</label>
                                <input type="url" value="https://instagram.com/sumanartglass" placeholder="https://instagram.com/...">
                            </div>
                            <div class="form-group">
                                <label>LinkedIn</label>
                                <input type="url" value="https://linkedin.com/company/sumanartglass" placeholder="https://linkedin.com/company/...">
                            </div>
                            <div class="form-group">
                                <label>YouTube</label>
                                <input type="url" value="" placeholder="https://youtube.com/...">
                            </div>
                            <div class="form-group">
                                <label>WhatsApp Number</label>
                                <input type="tel" value="+919876543210" placeholder="+91XXXXXXXXXX">
                            </div>
                            <div style="margin-top:1.5rem;">
                                <button class="btn btn-primary" onclick="showNotification('Social media links updated!')">Save Links</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SEO Tab -->
                <div class="tab-content" id="tab-seo" style="display:none;">
                    <div class="data-card">
                        <div class="data-card-header">
                            <h3>SEO Settings</h3>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label>Meta Title</label>
                                <input type="text" value="Suman Art Glass | Premium Glass & Aluminium Solutions in Lucknow">
                            </div>
                            <div class="form-group">
                                <label>Meta Description</label>
                                <textarea rows="3">Suman Art Glass is Lucknow's leading provider of curtain wall glazing, spider glazing, structural glazing, UPVC windows, and aluminium partition solutions. 15+ years of expertise.</textarea>
                            </div>
                            <div class="form-group">
                                <label>Keywords</label>
                                <textarea rows="2">glass glazing, curtain wall, spider glazing, structural glazing, UPVC windows, aluminium partition, facade systems, Lucknow, glass solutions</textarea>
                            </div>
                            <div class="form-group">
                                <label>Google Analytics ID</label>
                                <input type="text" placeholder="G-XXXXXXXXXX" value="">
                            </div>
                            <div style="margin-top:1.5rem;">
                                <button class="btn btn-primary" onclick="showNotification('SEO settings updated!')">Save SEO Settings</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true') window.location.href = 'login.html';
        function handleLogout() { localStorage.removeItem('adminLoggedIn'); window.location.href = 'login.html'; }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'block';
            event.target.classList.add('active');
        }

        function showNotification(message, type = 'success') {
            const n = document.createElement('div');
            n.className = 'notification';
            n.textContent = message;
            n.style.cssText = 'position:fixed;top:20px;right:20px;padding:1rem 1.5rem;border-radius:8px;color:white;font-weight:500;z-index:10000;animation:slideIn 0.3s ease;background:#22c55e;';
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }
    </script>
</body>
</html>
